name: images

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC: fresh rebuild without cache
  push:
    branches: [main]
    paths: ["images/**", "tests/**", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", "tests/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels an older in-flight run, so an outdated build can never
# finish last and overwrite :latest.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-unit
      - run: make test-cap

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR; only this job gets it
    strategy:
      fail-fast: false
      matrix:
        image: [claude, dind]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/claude-remote-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
