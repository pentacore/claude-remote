# Local builds (tests, development). Deployments pull the GHCR images named in compose.yaml.
services:
  dind:
    build:
      context: ./images/dind
      args:
        DOCKER_MAJOR: ${DOCKER_MAJOR:-29}
    image: claude-remote-dind:local
  claude:
    build:
      context: ./images/claude
      args:
        DOCKER_MAJOR: ${DOCKER_MAJOR:-29}
    image: claude-remote-claude:local
